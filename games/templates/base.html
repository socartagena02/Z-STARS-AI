{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Z-STARS AI {% endblock %} </title>
    <link rel="icon" href="{% static 'games/assets/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'games/css/style.css' %}">
    <meta property="og:title" content="Z-STARS AI">
    <meta property="og:description" content="Plataforma de evaluación y rehabilitación cognitiva.">
    <meta property="og:image" content="https://zstars-ai.com{% static 'assets/og-cover.png' %}">
    <meta property="og:image:width" content="1200"> 
    <meta property="og:image:height" content="630"> 
    <meta property="og:type" content="website">
    <meta property="og:url" content="zstars-ai.com/">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" integrity="sha384-kknyxLIUnHEyAUUoSRgQzEAsz6qH3Vb3GZ4M9P50Fq032U7Q4oX3X00/F5eQ2V75" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
 
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
