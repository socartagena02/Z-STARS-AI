{% extends "base.html" %}
{% load static %}
{% block title %}Recuperar Contraseña | Z-STARS AI{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'games/css/registro.css' %}">
{% endblock %}

{% block content %}
<body class="login-page">
    <div class="login-wrapper">
        <div class="card login-card shadow-lg">
            <div class="card-body p-4">
                <h2 class="text-center mb-4 fw-bold">Recuperar Contraseña</h2>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control" required>
                        <small class="text-muted">Ingresa el email asociado a tu cuenta</small>
                    </div>
                    <button type="submit" class="btn-send">Enviar link de recuperación</button>
                </form>
                <hr>
                <p class="text-center">
                    <a href="{% url 'iniciosesion' %}" class="login-link">volver al login</a>
                </p>
            </div>
        </div>
    </div>
</body>
{% endblock %}
