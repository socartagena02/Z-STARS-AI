{% extends "base.html" %}
{% load static %}
{% block title %}Inicio de sesión | Z-STARS AI{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'games/css/inicio-sesion.css' %}">
{% endblock %}
    
<meta name="robots" content="noindex, follow">

{% block content %}
<body class="login-page">
    <div class="login-wrapper">
        <div class="card login-card shadow-lg">
            <div class="card-body p-4">
                <h2 class="text-center mb-4 fw-bold">Inicio de sesión</h2>
               <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" name="username" class="form-control" placeholder="Nombre de usuario" autocomplete="username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Contraseña" autocomplete="current-password" required>
                    </div>
                    {% if error %}
                    <div class="alert alert-danger p-2 small">{{ error }}</div>
                    {% endif %}
                    <hr class="my-3">
                    <div class="text-center mt-3">
                        <small>
                            <a href="{% url 'registro' %}">Registrate</a> • 
                            <a href="{% url 'password_reset_request' %}">Olvidé mi contraseña</a>
                        </small>
                    </div>
                    <div class="btn-seccion">
                        <button type="submit" class="btn-inicio-sesion">Iniciar Sesión</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
{% endblock %}
