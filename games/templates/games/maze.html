{% extends "base.html" %}
{% load static %}
{% block title %} Traza mi camino - Z-STARS AI {% endblock %}
{% block extra_css %}
    <link rel="stylesheet" href="{% static 'games/css/maze.css' %}">
    <link rel="icon" href="{% static 'games/assets/favicon.ico' %}">
{% endblock %}
{% block content %}
    <h1>Traza mi camino</h1>
    <div class="info">
        <div>⏱ Tiempo: <span id="timer">30</span></div>
        <div>⭐ Checkpoint <span id="CheckpointCount">0</span>/<span id="checkpointTotal">2</span></div>
        <div id="levelIndicator">Nivel 1 / 3</div>
    </div>
    <canvas id="mazeCanvas"></canvas>
    <div id="message" class="message"></div>
    <button onclick="restartGame()">
        Reiniciar
    </button>
{% endblock %}
{% block extra_js %}
    <script src="{% static 'games/js/maze.js' %}"></script>
{% endblock %}
